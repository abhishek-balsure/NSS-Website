<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NSS Admin Dashboard">
  <title>Dashboard — Sarhad NSS Admin</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dashboard — Sarhad NSS Admin">
    <meta property="og:description" content="NSS Admin Dashboard">
    <meta property="og:url" content="https://nss-website-8uv.pages.dev/admin-dashboard.html">
    <meta property="og:image" content="https://nss-website-8uv.pages.dev/logos/nss.jpg">
    <meta property="og:site_name" content="Sarhad NSS">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dashboard — Sarhad NSS Admin">
    <meta name="twitter:description" content="NSS Admin Dashboard">
    <meta name="twitter:image" content="https://nss-website-8uv.pages.dev/logos/nss.jpg">
    <link rel="canonical" href="https://nss-website-8uv.pages.dev/admin-dashboard.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .dashboard-page {
      min-height: 100vh;
      padding: calc(var(--nav-height) + 40px) 24px 80px;
    }

    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .dash-header h1 {
      font-size: 1.6rem;
    }

    .dash-header .admin-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .dash-header .admin-info .avatar {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--info), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .dash-header .admin-info .details .name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .dash-header .admin-info .details .role {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 24px;
      transition: all var(--transition-normal);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .stat-card .stat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .stat-card .stat-top i {
      font-size: 1.4rem;
      color: var(--accent);
      opacity: 0.6;
    }

    .stat-card .stat-number {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
    }

    .stat-card .stat-label {
      font-size: 0.82rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card.warn .stat-number { color: var(--accent); }
    .stat-card.ok   .stat-number { color: var(--success); }
    .stat-card.info .stat-number { color: var(--info); }

    .loading-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      flex-direction: column;
      gap: 16px;
      color: var(--text-secondary);
    }

    .loading-overlay .spinner {
      font-size: 2rem;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .dash-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e68a00">
    <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon"><img src="logos/nss.jpg" alt="NSS Logo"></div>
        NSS<span>Admin</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="admin-dashboard.html" class="active"><i class="fas fa-gauge-high"></i> Dashboard</a>
        <a href="admin-panel.html"><i class="fas fa-table-cells-large"></i> Panel</a>
        <a href="#" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Sign Out</a>
      </div>
      <button class="theme-toggle" aria-label="Toggle dark mode"><span class="icon-sun"><i class="fas fa-sun"></i></span><span class="icon-moon"><i class="fas fa-moon"></i></span></button>
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>

  <main class="dashboard-page">
    <div class="loading-overlay" id="loading">
      <i class="fas fa-circle-notch spinner"></i>
      <span>Loading dashboard...</span>
    </div>

    <div id="dashContent" style="display:none">
      <div class="dash-header">
        <h1><i class="fas fa-gauge-high" style="color:var(--accent)"></i> Dashboard</h1>
        <div class="admin-info" id="adminInfo"></div>
      </div>

      <div class="stats-grid" id="statsGrid"></div>

      <div class="analytics-grid" id="analyticsGrid" style="display:none">
        <div class="analytics-card">
          <h3><i class="fas fa-chart-column"></i> Approved Attendance by Month</h3>
          <div id="monthChart" class="bar-chart"></div>
        </div>
        <div class="analytics-card">
          <h3><i class="fas fa-list-ol"></i> Most Attended Activity Types</h3>
          <div id="typeChart" class="bar-chart"></div>
        </div>
        <div class="analytics-card">
          <h3><i class="fas fa-user-check"></i> Volunteer Status</h3>
          <div id="statusChart" class="bar-chart"></div>
        </div>
        <div class="analytics-card">
          <h3><i class="fas fa-clock"></i> Total Volunteer Hours Logged</h3>
          <div class="big-number" id="totalHoursNum">0</div>
        </div>
      </div>

      <div style="text-align:center;padding:40px 0;color:var(--text-muted);font-size:0.9rem">
        <i class="fas fa-shield-halved"></i> Protected by HMAC-signed session cookie
      </div>
    </div>
  </main>

  <style>
    .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 24px; }
    .analytics-card {
      background: var(--bg-glass); border: 1px solid var(--border-glass);
      border-radius: var(--radius-md, 10px); padding: 20px;
    }
    .analytics-card h3 { font-size: 0.95rem; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 0.82rem; }
    .bar-row .bar-label { width: 90px; flex-shrink: 0; text-transform: capitalize; color: var(--text-muted); }
    .bar-row .bar-track { flex: 1; background: rgba(127,127,127,0.15); border-radius: 4px; height: 14px; overflow: hidden; }
    .bar-row .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
    .bar-row .bar-count { width: 32px; text-align: right; font-weight: 600; }
    .big-number { font-size: 2.6rem; font-weight: 700; color: var(--accent); text-align: center; padding: 12px 0; }
    .empty-note { color: var(--text-muted); font-size: 0.85rem; }
  </style>

  <script src="shared.js"></script>
  <script>
    (async function() {
      try {
        const res = await fetch('/api/admin/me');
        if (res.status === 401) { window.location.href = '/admin-login.html'; return; }
        if (!res.ok) throw new Error('Failed to load admin info (status ' + res.status + ')');
        const { user } = await res.json();

        document.getElementById('adminInfo').innerHTML = `
          <div class="avatar">${user.name ? user.name.charAt(0).toUpperCase() : 'A'}</div>
          <div class="details">
            <div class="name">${user.name || 'Admin'}</div>
            <div class="role">${user.role || 'admin'} &middot; ${user.email || ''}</div>
          </div>
        `;

        const dashRes = await fetch('/api/admin/dashboard');
        if (dashRes.status === 401) { window.location.href = '/admin-login.html'; return; }
        if (!dashRes.ok) {
          const errBody = await dashRes.text();
          throw new Error('Failed to load stats (status ' + dashRes.status + '): ' + errBody);
        }
        const { stats } = await dashRes.json();

        const cards = [
          { num: stats.total_volunteers, label: 'Total Volunteers', icon: 'fa-users', cls: 'info' },
          { num: stats.pending_approvals, label: 'Pending Approvals', icon: 'fa-clock', cls: 'warn' },
          { num: stats.total_activities, label: 'Activities', icon: 'fa-calendar', cls: 'ok' },
          { num: stats.total_attendance, label: 'Attendance Records', icon: 'fa-clipboard-list', cls: 'info' },
        ];

        document.getElementById('statsGrid').innerHTML = cards.map(c => `
          <div class="stat-card ${c.cls}">
            <div class="stat-top">
              <span class="stat-number">${c.num}</span>
              <i class="fas ${c.icon}"></i>
            </div>
            <div class="stat-label">${c.label}</div>
          </div>
        `).join('');

        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashContent').style.display = 'block';

        loadAnalytics();
      } catch (e) {
        console.error('Dashboard load error:', e);
        document.getElementById('loading').innerHTML =
          '<div style="color:#ff6b6b;text-align:center;max-width:500px">' +
          '<i class="fas fa-triangle-exclamation" style="font-size:2rem"></i>' +
          '<p style="margin-top:12px">' + e.message + '</p>' +
          '<a href="/admin-login.html" style="color:var(--accent)">Back to login</a>' +
          '</div>';
      }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/admin/logout', { method: 'POST' });
      window.location.href = '/admin-login.html';
    });

    function renderBarChart(containerId, items, labelKey, countKey) {
      const el = document.getElementById(containerId);
      if (!items || !items.length) { el.innerHTML = '<p class="empty-note">No data yet.</p>'; return; }
      const max = Math.max(...items.map(i => i[countKey]), 1);
      el.innerHTML = items.map(i => `
        <div class="bar-row">
          <span class="bar-label">${i[labelKey]}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${(i[countKey] / max * 100).toFixed(0)}%"></span></span>
          <span class="bar-count">${i[countKey]}</span>
        </div>
      `).join('');
    }

    async function loadAnalytics() {
      try {
        const res = await fetch('/api/admin/analytics');
        if (!res.ok) throw new Error();
        const { attendanceByMonth, topActivityTypes, volunteerStatus, totalHours } = await res.json();

        document.getElementById('analyticsGrid').style.display = 'grid';

        const monthLabels = (attendanceByMonth || []).map(m => ({
          month: new Date(m.month + '-01').toLocaleDateString('en-IN', { month: 'short', year: '2-digit' }),
          count: m.count,
        }));
        renderBarChart('monthChart', monthLabels, 'month', 'count');
        renderBarChart('typeChart', topActivityTypes, 'type', 'count');

        const statusItems = Object.entries(volunteerStatus || {}).map(([type, count]) => ({ type, count }));
        renderBarChart('statusChart', statusItems, 'type', 'count');

        document.getElementById('totalHoursNum').textContent = totalHours || 0;
      } catch (e) {
        document.getElementById('analyticsGrid').style.display = 'none';
      }
    }
  </script>
</body>
</html>
