<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NSS Admin Login">
  <title>Admin Login — Sarhad NSS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--info));
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header .shield-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-md);
      background: rgba(37, 99, 235, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 1.6rem;
      color: var(--info);
    }

    .login-header h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .login-header p {
      color: var(--text-secondary);
      font-size: 0.88rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .form-group .input-wrap {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }

    .form-group .input-wrap:focus-within {
      border-color: var(--accent);
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
    }

    .form-group .input-wrap i {
      padding: 0 0 0 14px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group .input-wrap input {
      width: 100%;
      padding: 14px 14px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
    }

    .form-group .input-wrap input::placeholder {
      color: var(--text-muted);
    }

    .form-group.error .input-wrap {
      border-color: var(--danger);
    }

    .form-group .error-text {
      display: none;
      font-size: 0.8rem;
      color: var(--danger);
      margin-top: 6px;
    }

    .form-group.error .error-text {
      display: block;
    }

    .login-btn {
      width: 100%;
      justify-content: center;
      padding: 16px;
      font-size: 1rem;
    }

    .login-btn i {
      font-size: 0.9rem;
    }

    .login-error {
      display: none;
      padding: 12px 16px;
      background: rgba(220,38,38,0.08);
      border: 1px solid rgba(220,38,38,0.2);
      border-radius: var(--radius-sm);
      color: var(--danger);
      font-size: 0.88rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .login-error.visible {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle);
    }

    .login-footer a {
      color: var(--text-secondary);
      font-size: 0.85rem;
      transition: color var(--transition-fast);
    }

    .login-footer a:hover {
      color: var(--accent);
    }

    .login-footer a i {
      margin-right: 6px;
    }

    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="shield-icon"><i class="fas fa-shield-halved"></i></div>
        <h1>NSS <span class="gradient-text">Admin</span></h1>
        <p>Sign in to manage volunteers, activities &amp; attendance</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group" id="emailGroup">
          <label for="email">Email</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="admin@example.com" required autocomplete="email">
          </div>
          <span class="error-text">Please enter your email</span>
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">
          </div>
          <span class="error-text">Please enter your password</span>
          <div style="text-align:right;margin-top:8px">
            <a href="forgot-password.html" style="font-size:0.85rem">Forgot password?</a>
          </div>
        </div>

        <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
          <i class="fas fa-arrow-right-to-bracket"></i> <span>Sign In</span>
        </button>
      </form>

      <div class="login-footer">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailGroup = document.getElementById('emailGroup');
    const passwordGroup = document.getElementById('passwordGroup');
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    [emailInput, passwordInput].forEach(el => {
      el.addEventListener('input', () => {
        el.closest('.form-group').classList.remove('error');
        errorEl.classList.remove('visible');
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');

      let valid = true;

      if (!emailInput.value.trim()) {
        emailGroup.classList.add('error');
        valid = false;
      }
      if (!passwordInput.value) {
        passwordGroup.classList.add('error');
        valid = false;
      }
      if (!valid) return;

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Signing in...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Login failed');
        }

        window.location.href = '/admin-dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> <span>Sign In</span>';
      }
    });
  </script>
</body>
</html>
