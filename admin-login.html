<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NSS Admin Login">
  <title>Admin Login — Sarhad NSS</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Admin Login — Sarhad NSS">
    <meta property="og:description" content="NSS Admin Login">
    <meta property="og:url" content="https://nss-website-8uv.pages.dev/admin-login.html">
    <meta property="og:image" content="https://nss-website-8uv.pages.dev/logos/nss.jpg">
    <meta property="og:site_name" content="Sarhad NSS">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Admin Login — Sarhad NSS">
    <meta name="twitter:description" content="NSS Admin Login">
    <meta name="twitter:image" content="https://nss-website-8uv.pages.dev/logos/nss.jpg">
    <link rel="canonical" href="https://nss-website-8uv.pages.dev/admin-login.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="admin-login.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e68a00">
    <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="shield-icon"><i class="fas fa-shield-halved"></i></div>
        <h1>NSS <span class="gradient-text">Admin</span></h1>
        <p>Sign in to manage volunteers, activities &amp; attendance</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group" id="emailGroup">
          <label for="email">Email</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="admin@example.com" required autocomplete="email">
          </div>
          <span class="error-text">Please enter your email</span>
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">
          </div>
          <span class="error-text">Please enter your password</span>
          <div style="text-align:right;margin-top:8px">
            <a href="forgot-password.html" style="font-size:0.85rem">Forgot password?</a>
          </div>
        </div>

        <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
          <i class="fas fa-arrow-right-to-bracket"></i> <span>Sign In</span>
        </button>
      </form>

      <div class="login-footer">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailGroup = document.getElementById('emailGroup');
    const passwordGroup = document.getElementById('passwordGroup');
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    [emailInput, passwordInput].forEach(el => {
      el.addEventListener('input', () => {
        el.closest('.form-group').classList.remove('error');
        errorEl.classList.remove('visible');
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');

      let valid = true;

      if (!emailInput.value.trim()) {
        emailGroup.classList.add('error');
        valid = false;
      }
      if (!passwordInput.value) {
        passwordGroup.classList.add('error');
        valid = false;
      }
      if (!valid) return;

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Signing in...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Login failed');
        }

        window.location.href = '/admin-dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> <span>Sign In</span>';
      }
    });
  </script>
</body>
</html>
