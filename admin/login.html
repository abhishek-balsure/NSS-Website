<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login — Sarhad NSS</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 48px;
            max-width: 420px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--danger));
        }

        .form-icon {
            width: 60px; height: 60px;
            border-radius: var(--radius-md);
            background: rgba(220, 38, 38, 0.1);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 1.5rem;
            color: var(--danger);
        }

        h1 { text-align: center; font-size: 1.4rem; margin-bottom: 4px; }
        .sub { text-align: center; color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 28px; }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: var(--text-secondary); margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.7);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            font-size: 0.95rem; font-family: inherit;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--danger);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .btn-block {
            width: 100%; padding: 14px; font-size: 1rem;
            justify-content: center; margin-top: 8px;
        }

        .auth-error {
            display: none;
            background: rgba(220, 38, 38, 0.08);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: center;
        }
        .auth-error.visible { display: block; }

        .spinner-btn { pointer-events: none; opacity: 0.7; }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="form-icon"><i class="fas fa-user-shield"></i></div>
        <h1>Admin Access</h1>
        <p class="sub">Sarhad NSS Dashboard — authorized personnel only</p>

        <div class="auth-error" id="authError"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-danger btn-block" id="loginBtn">
                <i class="fas fa-lock"></i> Sign In
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm')
        const btn = document.getElementById('loginBtn')
        const errEl = document.getElementById('authError')

        form.addEventListener('submit', async (e) => {
            e.preventDefault()
            errEl.classList.remove('visible')
            btn.disabled = true
            btn.classList.add('spinner-btn')
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...'

            try {
                const res = await fetch('/admin/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: document.getElementById('password').value })
                })
                const result = await res.json()

                if (!res.ok) {
                    errEl.textContent = result.error || 'Login failed.'
                    errEl.classList.add('visible')
                    btn.disabled = false
                    btn.classList.remove('spinner-btn')
                    btn.innerHTML = '<i class="fas fa-lock"></i> Sign In'
                    return
                }

                window.location.href = '/admin/index.html'
            } catch (err) {
                errEl.textContent = 'Network error. Please try again.'
                errEl.classList.add('visible')
                btn.disabled = false
                btn.classList.remove('spinner-btn')
                btn.innerHTML = '<i class="fas fa-lock"></i> Sign In'
            }
        })
    </script>
</body>

</html>
