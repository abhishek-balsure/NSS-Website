<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Sarhad NSS account password">
  <title>Forgot Password — Sarhad NSS</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Forgot Password — Sarhad NSS">
    <meta property="og:description" content="Reset your Sarhad NSS account password">
    <meta property="og:url" content="https://nss-website-8uv.pages.dev/forgot-password.html">
    <meta property="og:image" content="https://nss-website-8uv.pages.dev/logos/nss.jpg">
    <meta property="og:site_name" content="Sarhad NSS">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Forgot Password — Sarhad NSS">
    <meta name="twitter:description" content="Reset your Sarhad NSS account password">
    <meta name="twitter:image" content="https://nss-website-8uv.pages.dev/logos/nss.jpg">
    <link rel="canonical" href="https://nss-website-8uv.pages.dev/forgot-password.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-height) + 24px) 24px 60px;
    }
    .auth-card {
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
    }
    .auth-card h1 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; }
    .auth-card p.subtitle { color: var(--text-muted); text-align: center; margin-bottom: 28px; font-size: 0.9rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.88rem; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .input-wrap input {
      width: 100%; padding: 12px 14px 12px 40px; border-radius: var(--radius-sm, 8px);
      border: 1px solid var(--border-glass); background: var(--bg-body); font: inherit; color: var(--text-primary);
    }
    .auth-btn { width: 100%; padding: 13px; margin-top: 6px; }
    .auth-msg { margin-top: 16px; font-size: 0.85rem; text-align: center; padding: 10px; border-radius: 6px; display: none; }
    .auth-msg.success { display: block; background: rgba(5,150,105,0.1); color: var(--success); }
    .auth-msg.error { display: block; background: rgba(220,38,38,0.1); color: var(--danger); }
    .back-link { text-align: center; margin-top: 20px; font-size: 0.88rem; }
  </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e68a00">
    <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1><i class="fas fa-key" style="color:var(--accent)"></i> Forgot Password</h1>
      <p class="subtitle">Enter your email and we'll send you a reset link.</p>

      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">
          <i class="fas fa-paper-plane"></i> <span>Send Reset Link</span>
        </button>
        <div class="auth-msg" id="authMsg"></div>
      </form>

      <div class="back-link">
        <a href="volunteer-login.html">Volunteer Sign In</a> &middot; <a href="admin-login.html">Admin Sign In</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('authMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Sending...';
      msg.className = 'auth-msg';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong');

        msg.textContent = data.message || 'If an account exists for that email, a reset link has been sent.';
        msg.className = 'auth-msg success';
        form.querySelector('input').value = '';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'auth-msg error';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> <span>Send Reset Link</span>';
      }
    });
  </script>
</body>
</html>
