    <style>
        .page-header { padding: calc(var(--nav-height) + 60px) 0 30px; text-align: center; }
        .leaderboard-wrap { max-width: 640px; margin: 0 auto; padding: 0 24px 80px; }
        .lb-row {
            display: flex; align-items: center; gap: 16px;
            background: var(--bg-glass); border: 1px solid var(--border-glass);
            border-radius: var(--radius-md, 10px); padding: 14px 18px; margin-bottom: 10px;
        }
        .lb-rank {
            width: 36px; height: 36px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0;
            background: rgba(127,127,127,0.15); color: var(--text-secondary);
        }
        .lb-row:nth-child(1) .lb-rank { background: #FFD700; color: #4A3800; }
        .lb-row:nth-child(2) .lb-rank { background: #C0C0C0; color: #333; }
        .lb-row:nth-child(3) .lb-rank { background: #CD7F32; color: #fff; }
        .lb-info { flex: 1; min-width: 0; }
        .lb-info .lb-name { font-weight: 600; }
        .lb-info .lb-dept { font-size: 0.82rem; color: var(--text-muted); }
        .lb-hours { font-weight: 700; color: var(--accent); white-space: nowrap; }
        .empty-note { text-align: center; color: var(--text-muted); padding: 60px 24px; }
        .skeleton {
            background: linear-gradient(90deg, rgba(127,127,127,0.12) 25%, rgba(127,127,127,0.22) 37%, rgba(127,127,127,0.12) 63%);
            background-size: 400% 100%;
            animation: skeleton-shimmer 1.4s ease infinite;
            border-radius: var(--radius-md, 10px);
        }
        @keyframes skeleton-shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .lb-skeleton { height: 64px; margin-bottom: 10px; }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e68a00">
    <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="nav-logo">
                <div class="logo-icon"><img src="logos/nss.jpg" alt="NSS Logo"></div>
                Sarhad<span>NSS</span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="aboutus.html">About</a>
                <a href="activities.html">Activities</a>
                <a href="events.html">Events</a>
                <a href="contactus.html">Contact</a>
                <div class="nav-dropdown">
                    <button type="button" class="nav-dropdown-toggle">More <i class="fas fa-chevron-down"></i></button>
                    <div class="nav-dropdown-menu">
                        <a href="quiz.html">Quiz</a>
                        <a href="resources.html">Resources</a>
                        <a href="alumni.html">Alumni</a>
                        <a href="gallery.html">Gallery</a>
                        <a href="leaderboard.html" class="active">Leaderboard</a>
                    </div>
                </div>
                <a href="volunteer-login.html">Sign In</a>
                <a href="register.html" class="nav-cta">Join NSS</a>
                <a href="admin-login.html" class="nav-admin">Admin</a>
            </div>
            <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
    <div class="nav-overlay" id="navOverlay"></div>

    <main>
        <section class="page-header">
            <h1><i class="fas fa-trophy" style="color:var(--accent)"></i> Volunteer Leaderboard</h1>
            <p>Top volunteers by verified, admin-approved hours.</p>
        </section>
        <div class="leaderboard-wrap" id="leaderboardWrap">
            <div class="skeleton lb-skeleton"></div>
            <div class="skeleton lb-skeleton"></div>
            <div class="skeleton lb-skeleton"></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Sarhad NSS. All rights reserved. &middot; <a href="privacy-policy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Use</a></p>
        </div>
    </footer>

    <script src="shared.js"></script>
    <script>
        function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

        async function loadLeaderboard() {
            const wrap = document.getElementById('leaderboardWrap');
            try {
                const res = await fetch('/api/leaderboard/list');
                if (!res.ok) throw new Error();
                const { leaderboard } = await res.json();
                if (!leaderboard || !leaderboard.length) {
                    wrap.innerHTML = '<p class="empty-note">No approved hours logged yet — check back soon!</p>';
                    return;
                }
                wrap.innerHTML = leaderboard.map((v, i) => `
                    <div class="lb-row">
                        <div class="lb-rank">${i + 1}</div>
                        <div class="lb-info">
                            <div class="lb-name">${esc(v.name)}</div>
                            <div class="lb-dept">${esc(v.department || '')}</div>
                        </div>
                        <div class="lb-hours">${badgeFor(v.hours)} ${v.hours.toFixed(1)} hrs</div>
                    </div>
                `).join('');
            } catch (e) {
                wrap.innerHTML = '<p class="empty-note">Could not load the leaderboard right now.</p>';
            }
        }

        function badgeFor(hours) {
            if (hours >= 50) return '🥇';
            if (hours >= 25) return '🥈';
            if (hours >= 10) return '🥉';
            return '';
        }
        loadLeaderboard();
    </script>
</body>
</html>
