<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set a new password for your Sarhad NSS account">
  <title>Reset Password — Sarhad NSS</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Reset Password — Sarhad NSS">
    <meta property="og:description" content="Set a new password for your Sarhad NSS account">
    <meta property="og:url" content="https://nss-website-8uv.pages.dev/reset-password.html">
    <meta property="og:image" content="https://nss-website-8uv.pages.dev/logos/nss.jpg">
    <meta property="og:site_name" content="Sarhad NSS">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Reset Password — Sarhad NSS">
    <meta name="twitter:description" content="Set a new password for your Sarhad NSS account">
    <meta name="twitter:image" content="https://nss-website-8uv.pages.dev/logos/nss.jpg">
    <link rel="canonical" href="https://nss-website-8uv.pages.dev/reset-password.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-height) + 24px) 24px 60px;
    }
    .auth-card {
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
    }
    .auth-card h1 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; }
    .auth-card p.subtitle { color: var(--text-muted); text-align: center; margin-bottom: 28px; font-size: 0.9rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.88rem; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .input-wrap input {
      width: 100%; padding: 12px 14px 12px 40px; border-radius: var(--radius-sm, 8px);
      border: 1px solid var(--border-glass); background: var(--bg-body); font: inherit; color: var(--text-primary);
    }
    .auth-btn { width: 100%; padding: 13px; margin-top: 6px; }
    .auth-msg { margin-top: 16px; font-size: 0.85rem; text-align: center; padding: 10px; border-radius: 6px; display: none; }
    .auth-msg.success { display: block; background: rgba(5,150,105,0.1); color: var(--success); }
    .auth-msg.error { display: block; background: rgba(220,38,38,0.1); color: var(--danger); }
  </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e68a00">
    <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1><i class="fas fa-lock-open" style="color:var(--accent)"></i> Reset Password</h1>
      <p class="subtitle" id="subtitle">Checking your reset link...</p>

      <form id="resetForm" style="display:none">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="newPassword" placeholder="At least 8 characters" required minlength="8">
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="confirmPassword" placeholder="Re-enter password" required minlength="8">
          </div>
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">
          <i class="fas fa-check"></i> <span>Set New Password</span>
        </button>
      </form>
      <div class="auth-msg" id="authMsg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let supabase;
    const subtitle = document.getElementById('subtitle');
    const form = document.getElementById('resetForm');
    const msg = document.getElementById('authMsg');

    (async function init() {
      try {
        const cfgRes = await fetch('/api/config');
        const cfg = await cfgRes.json();
        supabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

        // Supabase's recovery link lands here with the session info in the
        // URL hash — the client library picks it up automatically on load
        // and fires this event once it's parsed the recovery token.
        supabase.auth.onAuthStateChange((event, session) => {
          if (event === 'PASSWORD_RECOVERY') {
            subtitle.textContent = 'Enter a new password below.';
            form.style.display = 'block';
          }
        });

        // If the hash was already processed before our listener attached
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          subtitle.textContent = 'Enter a new password below.';
          form.style.display = 'block';
        } else {
          setTimeout(() => {
            if (form.style.display === 'none') {
              subtitle.textContent = '';
              msg.textContent = 'This reset link is invalid or has expired. Request a new one.';
              msg.className = 'auth-msg error';
            }
          }, 2500);
        }
      } catch (e) {
        subtitle.textContent = '';
        msg.textContent = 'Could not verify reset link. Try requesting a new one.';
        msg.className = 'auth-msg error';
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;

      if (p1.length < 8) {
        msg.textContent = 'Password must be at least 8 characters.';
        msg.className = 'auth-msg error';
        return;
      }
      if (p1 !== p2) {
        msg.textContent = 'Passwords do not match.';
        msg.className = 'auth-msg error';
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Saving...';

      try {
        const { error } = await supabase.auth.updateUser({ password: p1 });
        if (error) throw error;

        form.style.display = 'none';
        subtitle.textContent = '';
        msg.textContent = 'Password updated! You can now sign in with your new password.';
        msg.className = 'auth-msg success';
        await supabase.auth.signOut();
      } catch (err) {
        msg.textContent = err.message || 'Could not update password.';
        msg.className = 'auth-msg error';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> <span>Set New Password</span>';
      }
    });
  </script>
</body>
</html>
