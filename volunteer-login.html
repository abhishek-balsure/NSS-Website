<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your NSS volunteer account">
  <title>Sign In — Sarhad NSS</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sign In — Sarhad NSS">
    <meta property="og:description" content="Sign in to your NSS volunteer account">
    <meta property="og:url" content="https://nss-website-8uv.pages.dev/volunteer-login.html">
    <meta property="og:image" content="https://nss-website-8uv.pages.dev/logos/nss.jpg">
    <meta property="og:site_name" content="Sarhad NSS">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sign In — Sarhad NSS">
    <meta name="twitter:description" content="Sign in to your NSS volunteer account">
    <meta name="twitter:image" content="https://nss-website-8uv.pages.dev/logos/nss.jpg">
    <link rel="canonical" href="https://nss-website-8uv.pages.dev/volunteer-login.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="volunteer-login.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e68a00">
    <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon"><img src="logos/nss.jpg" alt="NSS Logo"></div>
        Sarhad<span>NSS</span>
      </a>
      <div class="nav-logos-strip">
        <img src="logos/clg.jpg" alt="Sarhad College Logo">
        <img src="logos/sppu.jpg" alt="SPPU Logo">
      </div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="aboutus.html">About</a>
        <a href="activities.html">Activities</a>
        <a href="resources.html">Resources</a>
        <a href="alumni.html">Alumni</a>
        <a href="contactus.html">Contact</a>
        <a href="volunteer-login.html" class="nav-cta active">Sign In</a>
        <a href="volunteer-signup.html">Join NSS</a>
      </div>
      <button class="theme-toggle" aria-label="Toggle dark mode"><span class="icon-sun"><i class="fas fa-sun"></i></span><span class="icon-moon"><i class="fas fa-moon"></i></span></button>
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon"><i class="fas fa-right-to-bracket"></i></div>
        <h1>Welcome <span class="gradient-text">Back</span></h1>
        <p>Sign in to your NSS volunteer account</p>
      </div>

      <div class="auth-error" id="authError"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group" id="emailGroup">
          <label for="email">Email</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <span class="error-text">Please enter your email</span>
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Enter your password" data-validate="password" required autocomplete="current-password">
          </div>
          <span class="error-text">Please enter your password</span>
          <div style="text-align:right;margin-top:8px">
            <a href="forgot-password.html" style="font-size:0.85rem">Forgot password?</a>
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-btn" id="loginBtn">
          <i class="fas fa-arrow-right-to-bracket"></i> <span>Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="volunteer-signup.html">Create one</a>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const errorEl = document.getElementById('authError');
    const btn = document.getElementById('loginBtn');

    [emailInput, passInput].forEach(el => {
      el.addEventListener('input', () => { el.closest('.form-group').classList.remove('error'); errorEl.classList.remove('visible'); });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');
      let valid = true;

      if (!emailInput.value.trim()) { document.getElementById('emailGroup').classList.add('error'); valid = false; }
      if (!passInput.value) { document.getElementById('passwordGroup').classList.add('error'); valid = false; }
      if (!valid) return;

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Signing in...';

      try {
        const res = await fetch('/api/volunteer/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value.trim(), password: passInput.value }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        // Respect a same-site ?redirect= param (e.g. quiz.html) so users
        // land back where they were asked to sign in.
        const redirectParam = new URLSearchParams(window.location.search).get('redirect');
        const safeRedirect = redirectParam
            && /^[a-zA-Z0-9_\-./]+\.html$/.test(redirectParam)
            && !redirectParam.startsWith('//')
            && !redirectParam.includes('..')
            ? redirectParam : 'volunteer-dashboard.html';
        window.location.href = '/' + safeRedirect;
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> <span>Sign In</span>';
      }
    });
  </script>
</body>
</html>
