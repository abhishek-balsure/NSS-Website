<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your NSS volunteer account">
  <title>Sign In — Sarhad NSS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-height) + 24px) 24px 60px;
    }
    .auth-card {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--info), var(--accent));
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-header .auth-icon {
      width: 64px; height: 64px;
      border-radius: var(--radius-md);
      background: rgba(37,99,235,0.1);
      display: flex;
      align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 1.6rem;
      color: var(--info);
    }
    .auth-header h1 { font-size: 1.4rem; margin-bottom: 6px; }
    .auth-header p { color: var(--text-secondary); font-size: 0.88rem; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 0.8rem; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .form-group .input-wrap {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }
    .form-group .input-wrap:focus-within {
      border-color: var(--accent);
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
    }
    .form-group .input-wrap i {
      padding: 0 0 0 14px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .form-group .input-wrap input {
      width: 100%;
      padding: 14px 14px;
      background: transparent; border: none; outline: none;
      font-size: 0.95rem; font-family: 'Inter', sans-serif;
      color: var(--text-primary);
    }
    .form-group .input-wrap input::placeholder { color: var(--text-muted); }
    .form-group.error .input-wrap { border-color: var(--danger); }
    .form-group .error-text { display: none; font-size: 0.8rem; color: var(--danger); margin-top: 6px; }
    .form-group.error .error-text { display: block; }
    .auth-btn { width: 100%; justify-content: center; padding: 16px; font-size: 1rem; }
    .auth-error {
      display: none; padding: 12px 16px;
      background: rgba(220,38,38,0.08);
      border: 1px solid rgba(220,38,38,0.2);
      border-radius: var(--radius-sm);
      color: var(--danger); font-size: 0.88rem;
      margin-bottom: 20px; text-align: center;
    }
    .auth-error.visible { display: block; }
    .auth-footer {
      text-align: center; margin-top: 24px;
      padding-top: 20px; border-top: 1px solid var(--border-subtle);
    }
    .auth-footer a { color: var(--accent); font-size: 0.9rem; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
    .spinner { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width:480px) { .auth-card { padding: 32px 24px; } }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon"><img src="logos/nss.jpg" alt="NSS Logo"></div>
        Sarhad<span>NSS</span>
      </a>
      <div class="nav-logos-strip">
        <img src="logos/clg.jpg" alt="Sarhad College Logo">
        <img src="logos/sppu.jpg" alt="SPPU Logo">
      </div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="aboutus.html">About</a>
        <a href="activities.html">Activities</a>
        <a href="resources.html">Resources</a>
        <a href="alumni.html">Alumni</a>
        <a href="contactus.html">Contact</a>
        <a href="volunteer-login.html" class="nav-cta active">Sign In</a>
        <a href="volunteer-signup.html">Join NSS</a>
      </div>
      <button class="theme-toggle" aria-label="Toggle dark mode"><span class="icon-sun"><i class="fas fa-sun"></i></span><span class="icon-moon"><i class="fas fa-moon"></i></span></button>
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon"><i class="fas fa-right-to-bracket"></i></div>
        <h1>Welcome <span class="gradient-text">Back</span></h1>
        <p>Sign in to your NSS volunteer account</p>
      </div>

      <div class="auth-error" id="authError"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group" id="emailGroup">
          <label for="email">Email</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <span class="error-text">Please enter your email</span>
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Enter your password" data-validate="password" required autocomplete="current-password">
          </div>
          <span class="error-text">Please enter your password</span>
        </div>

        <button type="submit" class="btn btn-primary auth-btn" id="loginBtn">
          <i class="fas fa-arrow-right-to-bracket"></i> <span>Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="volunteer-signup.html">Create one</a>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const errorEl = document.getElementById('authError');
    const btn = document.getElementById('loginBtn');

    [emailInput, passInput].forEach(el => {
      el.addEventListener('input', () => { el.closest('.form-group').classList.remove('error'); errorEl.classList.remove('visible'); });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');
      let valid = true;

      if (!emailInput.value.trim()) { document.getElementById('emailGroup').classList.add('error'); valid = false; }
      if (!passInput.value) { document.getElementById('passwordGroup').classList.add('error'); valid = false; }
      if (!valid) return;

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Signing in...';

      try {
        const res = await fetch('/api/volunteer/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value.trim(), password: passInput.value }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        window.location.href = '/volunteer-dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> <span>Sign In</span>';
      }
    });
  </script>
</body>
</html>
